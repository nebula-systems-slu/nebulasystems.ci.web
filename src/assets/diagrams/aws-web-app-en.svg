<svg width="1440" height="860" viewBox="0 0 1440 860" xmlns="http://www.w3.org/2000/svg" font-family="'Liberation Mono','SF Mono',monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arM" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f22ea6"/>
    </marker>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="860" fill="#07080f"/>
  <rect width="1440" height="6" fill="url(#edge)"/>

  <!-- header -->
  <text x="48" y="62" fill="#eaf6f8" font-size="26" font-weight="700" letter-spacing="1">Web app in production</text>
  <text x="48" y="90" fill="#8fa3b0" font-size="14" letter-spacing="1">NEBULA SYSTEMS · AWS reference architecture — high availability, containers and cache</text>
  <line x1="48" y1="110" x2="1392" y2="110" stroke="#1b2333" stroke-width="1"/>

  <!-- ============ NODES ============ -->
  <!-- Users -->
  <g>
    <rect x="48" y="356" width="150" height="96" rx="12" fill="#0c0e18" stroke="#2b3a4d"/>
    <circle cx="123" cy="392" r="13" fill="none" stroke="#8fa3b0" stroke-width="2"/>
    <path d="M108 424 a15 13 0 0 1 30 0" fill="none" stroke="#8fa3b0" stroke-width="2"/>
    <text x="123" y="446" fill="#c4d2da" font-size="13" text-anchor="middle">Users</text>
  </g>

  <!-- Route 53 -->
  <g>
    <rect x="248" y="356" width="150" height="96" rx="12" fill="#0c0e18" stroke="#ff8a3d" stroke-opacity=".5"/>
    <text x="323" y="392" fill="#ff8a3d" font-size="13" font-weight="700" text-anchor="middle">Route 53</text>
    <text x="323" y="414" fill="#8fa3b0" font-size="11" text-anchor="middle">DNS</text>
  </g>

  <!-- CloudFront -->
  <g>
    <rect x="448" y="356" width="164" height="96" rx="12" fill="#0c0e18" stroke="#ff8a3d" stroke-opacity=".5"/>
    <text x="530" y="388" fill="#ff8a3d" font-size="13" font-weight="700" text-anchor="middle">CloudFront</text>
    <text x="530" y="410" fill="#8fa3b0" font-size="11" text-anchor="middle">CDN · edge · WAF</text>
  </g>

  <!-- S3 static (top branch) -->
  <g>
    <rect x="700" y="150" width="200" height="92" rx="12" fill="#170f1c" stroke="#f22ea6" stroke-opacity=".55"/>
    <text x="800" y="182" fill="#f22ea6" font-size="13" font-weight="700" text-anchor="middle">S3</text>
    <text x="800" y="204" fill="#c4d2da" font-size="11" text-anchor="middle">SPA / static assets</text>
  </g>

  <!-- VPC group -->
  <rect x="672" y="292" width="720" height="368" rx="16" fill="#0a0f14" stroke="#2b3a4d" stroke-dasharray="7 6"/>
  <text x="692" y="284" fill="#5f7d8c" font-size="12" letter-spacing="1">VPC · 10.0.0.0/16</text>

  <!-- public subnet -->
  <rect x="694" y="320" width="676" height="96" rx="10" fill="none" stroke="#22c1a8" stroke-opacity=".35" stroke-dasharray="4 5"/>
  <text x="708" y="338" fill="#22c1a8" font-size="11">Public Subnet</text>
  <g>
    <rect x="712" y="346" width="180" height="60" rx="10" fill="#0c0e18" stroke="#22d3ee" stroke-opacity=".6"/>
    <text x="802" y="374" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">ALB</text>
    <text x="802" y="392" fill="#8fa3b0" font-size="10" text-anchor="middle">Load Balancer</text>
  </g>

  <!-- private subnet app -->
  <rect x="694" y="430" width="676" height="100" rx="10" fill="none" stroke="#22d3ee" stroke-opacity=".28" stroke-dasharray="4 5"/>
  <text x="1356" y="448" fill="#4bb9cf" font-size="11" text-anchor="end">Private Subnet · App</text>
  <g>
    <rect x="712" y="456" width="200" height="64" rx="10" fill="#0c0e18" stroke="#22d3ee" stroke-opacity=".6"/>
    <text x="812" y="484" fill="#22d3ee" font-size="13" font-weight="700" text-anchor="middle">ECS Fargate</text>
    <text x="812" y="502" fill="#8fa3b0" font-size="10" text-anchor="middle">containers · auto-scale</text>
  </g>
  <g>
    <rect x="940" y="456" width="180" height="64" rx="10" fill="#0c0e18" stroke="#22d3ee" stroke-opacity=".35"/>
    <text x="1030" y="484" fill="#c4d2da" font-size="12" text-anchor="middle">API / Node.js</text>
    <text x="1030" y="502" fill="#8fa3b0" font-size="10" text-anchor="middle">tasks 2..N</text>
  </g>

  <!-- private subnet data -->
  <rect x="694" y="544" width="676" height="100" rx="10" fill="none" stroke="#f22ea6" stroke-opacity=".28" stroke-dasharray="4 5"/>
  <text x="1356" y="562" fill="#c85e9b" font-size="11" text-anchor="end">Private Subnet · Data</text>
  <g>
    <rect x="712" y="570" width="200" height="64" rx="10" fill="#170f1c" stroke="#f22ea6" stroke-opacity=".55"/>
    <text x="812" y="598" fill="#f22ea6" font-size="13" font-weight="700" text-anchor="middle">RDS PostgreSQL</text>
    <text x="812" y="616" fill="#8fa3b0" font-size="10" text-anchor="middle">Multi-AZ</text>
  </g>
  <g>
    <rect x="940" y="570" width="180" height="64" rx="10" fill="#170f1c" stroke="#f22ea6" stroke-opacity=".4"/>
    <text x="1030" y="598" fill="#f472c0" font-size="12" text-anchor="middle">ElastiCache</text>
    <text x="1030" y="616" fill="#8fa3b0" font-size="10" text-anchor="middle">Redis</text>
  </g>

  <!-- side rail: supporting -->
  <rect x="1150" y="346" width="222" height="288" rx="12" fill="#090c12" stroke="#1b2333"/>
  <text x="1163" y="372" fill="#5f7d8c" font-size="11" letter-spacing="1">OBSERVABILITY &amp; SECURITY</text>
  <g fill="#c4d2da" font-size="12">
    <rect x="1166" y="388" width="190" height="34" rx="8" fill="#0c0e18" stroke="#1b2333"/><text x="1180" y="410">ECR · images</text>
    <rect x="1166" y="430" width="190" height="34" rx="8" fill="#0c0e18" stroke="#1b2333"/><text x="1180" y="452">CloudWatch · logs/alarms</text>
    <rect x="1166" y="472" width="190" height="34" rx="8" fill="#0c0e18" stroke="#1b2333"/><text x="1180" y="494">IAM · least privilege</text>
    <rect x="1166" y="514" width="190" height="34" rx="8" fill="#0c0e18" stroke="#1b2333"/><text x="1180" y="536">Secrets Manager</text>
    <rect x="1166" y="556" width="190" height="34" rx="8" fill="#0c0e18" stroke="#1b2333"/><text x="1180" y="578">Terraform · IaC</text>
  </g>

  <!-- ============ ARROWS ============ -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M198 404 H244"/>
    <path d="M398 404 H444"/>
  </g>
  <!-- CloudFront -> S3 (up) -->
  <path d="M612 380 C660 340 660 220 696 200" stroke="#f22ea6" stroke-width="2" fill="none" marker-end="url(#arM)"/>
  <!-- CloudFront -> ALB -->
  <path d="M612 404 C650 404 676 376 708 376" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <!-- ALB -> ECS -->
  <path d="M802 406 V452" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <!-- ECS -> RDS -->
  <path d="M812 520 V566" stroke="#f22ea6" stroke-width="2" fill="none" marker-end="url(#arM)"/>
  <!-- ECS -> cache -->
  <path d="M900 488 C960 488 1000 520 1020 566" stroke="#f22ea6" stroke-width="2" fill="none" marker-end="url(#arM)"/>

  <!-- footer note -->
  <text x="48" y="800" fill="#5f7d8c" font-size="12">Flow: user → DNS → CDN → load balancer → containers → database/cache · Infra versioned in Terraform, deployed via CI/CD.</text>
</svg>
