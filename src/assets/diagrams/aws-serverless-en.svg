<svg width="1440" height="600" viewBox="0 0 1440 600" xmlns="http://www.w3.org/2000/svg" font-family="'Liberation Mono','SF Mono',monospace">
  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#22d3ee"/></marker>
    <marker id="sm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f22ea6"/></marker>
    <marker id="so" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff8a3d"/></marker>
    <linearGradient id="e3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>

  <rect width="1440" height="600" fill="#07080f"/>
  <rect width="1440" height="6" fill="url(#e3)"/>

  <text x="48" y="62" fill="#eaf6f8" font-size="26" font-weight="700" letter-spacing="1">Serverless Architecture</text>
  <text x="48" y="90" fill="#8fa3b0" font-size="14">NEBULA SYSTEMS · Auto-scaling, pay per use, no servers to manage</text>
  <line x1="48" y1="110" x2="1392" y2="110" stroke="#1b2333"/>

  <!-- Users -->
  <rect x="48" y="300" width="150" height="92" rx="12" fill="#0c0e18" stroke="#2b3a4d"/>
  <text x="123" y="343" fill="#c4d2da" font-size="13" text-anchor="middle">Users</text>
  <text x="123" y="363" fill="#8fa3b0" font-size="10" text-anchor="middle">web / mobile</text>

  <!-- CloudFront -->
  <rect x="246" y="300" width="164" height="92" rx="12" fill="#0c0e18" stroke="#ff8a3d" stroke-opacity=".5"/>
  <text x="328" y="338" fill="#ff8a3d" font-size="13" text-anchor="middle" font-weight="700">CloudFront</text>
  <text x="328" y="358" fill="#8fa3b0" font-size="10" text-anchor="middle">CDN</text>

  <!-- S3 static (top) -->
  <rect x="470" y="150" width="196" height="88" rx="12" fill="#170f1c" stroke="#f22ea6" stroke-opacity=".5"/>
  <text x="568" y="188" fill="#f22ea6" font-size="13" text-anchor="middle" font-weight="700">S3 · front</text>
  <text x="568" y="208" fill="#8fa3b0" font-size="10" text-anchor="middle">static SPA</text>

  <!-- API Gateway -->
  <rect x="470" y="300" width="184" height="92" rx="12" fill="#0c0e18" stroke="#22d3ee" stroke-opacity=".6"/>
  <text x="562" y="338" fill="#22d3ee" font-size="13" text-anchor="middle" font-weight="700">API Gateway</text>
  <text x="562" y="358" fill="#8fa3b0" font-size="10" text-anchor="middle">REST / HTTP</text>

  <!-- Cognito (auth) -->
  <rect x="470" y="440" width="184" height="68" rx="12" fill="#0c0e18" stroke="#ff8a3d" stroke-opacity=".45"/>
  <text x="562" y="470" fill="#ff8a3d" font-size="12" text-anchor="middle" font-weight="700">Cognito</text>
  <text x="562" y="490" fill="#8fa3b0" font-size="10" text-anchor="middle">auth · JWT</text>

  <!-- Lambda -->
  <rect x="726" y="300" width="184" height="92" rx="12" fill="#0c0e18" stroke="#22d3ee" stroke-opacity=".6"/>
  <text x="818" y="338" fill="#22d3ee" font-size="13" text-anchor="middle" font-weight="700">Lambda</text>
  <text x="818" y="358" fill="#8fa3b0" font-size="10" text-anchor="middle">functions · auto-scale</text>

  <!-- DynamoDB -->
  <rect x="982" y="248" width="196" height="84" rx="12" fill="#170f1c" stroke="#f22ea6" stroke-opacity=".55"/>
  <text x="1080" y="284" fill="#f22ea6" font-size="13" text-anchor="middle" font-weight="700">DynamoDB</text>
  <text x="1080" y="304" fill="#8fa3b0" font-size="10" text-anchor="middle">NoSQL · on-demand</text>

  <!-- S3 data -->
  <rect x="982" y="360" width="196" height="84" rx="12" fill="#170f1c" stroke="#f22ea6" stroke-opacity=".4"/>
  <text x="1080" y="396" fill="#f472c0" font-size="13" text-anchor="middle" font-weight="700">S3 · uploads</text>
  <text x="1080" y="416" fill="#8fa3b0" font-size="10" text-anchor="middle">files / media</text>

  <!-- side rail -->
  <rect x="1210" y="248" width="182" height="212" rx="12" fill="#090c12" stroke="#1b2333"/>
  <text x="1223" y="274" fill="#5f7d8c" font-size="11" letter-spacing="1">OPERATIONS</text>
  <g fill="#c4d2da" font-size="12">
    <rect x="1226" y="288" width="150" height="34" rx="8" fill="#0c0e18" stroke="#1b2333"/><text x="1240" y="310">CloudWatch</text>
    <rect x="1226" y="330" width="150" height="34" rx="8" fill="#0c0e18" stroke="#1b2333"/><text x="1240" y="352">X-Ray · traces</text>
    <rect x="1226" y="372" width="150" height="34" rx="8" fill="#0c0e18" stroke="#1b2333"/><text x="1240" y="394">IAM · roles</text>
    <rect x="1226" y="414" width="150" height="34" rx="8" fill="#0c0e18" stroke="#1b2333"/><text x="1240" y="436">SAM / Terraform</text>
  </g>

  <!-- arrows -->
  <path d="M198 346 H242" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#s)"/>
  <path d="M410 330 C440 320 442 210 466 200" stroke="#f22ea6" stroke-width="2" fill="none" marker-end="url(#sm)"/>
  <path d="M410 352 C440 360 446 346 466 346" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#s)"/>
  <path d="M562 440 V396" stroke="#ff8a3d" stroke-width="1.8" fill="none" stroke-dasharray="5 5" marker-end="url(#so)"/>
  <path d="M654 346 H722" stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#s)"/>
  <path d="M910 330 C946 318 950 300 978 290" stroke="#f22ea6" stroke-width="2" fill="none" marker-end="url(#sm)"/>
  <path d="M910 362 C946 374 950 392 978 400" stroke="#f22ea6" stroke-width="2" fill="none" marker-end="url(#sm)"/>

  <text x="48" y="548" fill="#5f7d8c" font-size="12">No servers to maintain · scales from zero to thousands of requests · you pay only for what runs.</text>
</svg>
