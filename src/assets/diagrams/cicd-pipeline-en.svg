<svg width="1440" height="560" viewBox="0 0 1440 560" xmlns="http://www.w3.org/2000/svg" font-family="'Liberation Mono','SF Mono',monospace">
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#22d3ee"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34d399"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff5c7a"/></marker>
    <linearGradient id="e2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  </defs>

  <rect width="1440" height="560" fill="#07080f"/>
  <rect width="1440" height="6" fill="url(#e2)"/>

  <text x="48" y="62" fill="#eaf6f8" font-size="26" font-weight="700" letter-spacing="1">Pipeline CI/CD</text>
  <text x="48" y="90" fill="#8fa3b0" font-size="14">NEBULA SYSTEMS · From commit to production — automated, tested and reproducible</text>
  <line x1="48" y1="110" x2="1392" y2="110" stroke="#1b2333"/>

  <!-- Dev -->
  <rect x="48" y="250" width="156" height="96" rx="12" fill="#0c0e18" stroke="#2b3a4d"/>
  <text x="126" y="294" fill="#c4d2da" font-size="13" text-anchor="middle" font-weight="700">Dev</text>
  <text x="126" y="314" fill="#8fa3b0" font-size="11" text-anchor="middle">git push / PR</text>

  <!-- GitHub -->
  <rect x="252" y="250" width="168" height="96" rx="12" fill="#0c0e18" stroke="#22d3ee" stroke-opacity=".5"/>
  <text x="336" y="290" fill="#22d3ee" font-size="13" text-anchor="middle" font-weight="700">GitHub</text>
  <text x="336" y="310" fill="#8fa3b0" font-size="10" text-anchor="middle">protected main · review</text>

  <!-- CI group -->
  <rect x="468" y="206" width="558" height="184" rx="16" fill="#0a0f14" stroke="#22d3ee" stroke-opacity=".35" stroke-dasharray="7 6"/>
  <text x="488" y="198" fill="#4bb9cf" font-size="12" letter-spacing="1">GitHub Actions · CI</text>

  <g>
    <rect x="490" y="256" width="164" height="84" rx="10" fill="#0c0e18" stroke="#22d3ee" stroke-opacity=".55"/>
    <text x="572" y="292" fill="#22d3ee" font-size="13" text-anchor="middle" font-weight="700">Lint · Tests</text>
    <text x="572" y="312" fill="#8fa3b0" font-size="10" text-anchor="middle">unit + integration</text>
  </g>
  <g>
    <rect x="672" y="256" width="164" height="84" rx="10" fill="#0c0e18" stroke="#22d3ee" stroke-opacity=".55"/>
    <text x="754" y="292" fill="#22d3ee" font-size="13" text-anchor="middle" font-weight="700">Build</text>
    <text x="754" y="312" fill="#8fa3b0" font-size="10" text-anchor="middle">Docker image</text>
  </g>
  <g>
    <rect x="854" y="256" width="152" height="84" rx="10" fill="#170f1c" stroke="#f22ea6" stroke-opacity=".5"/>
    <text x="930" y="292" fill="#f22ea6" font-size="13" text-anchor="middle" font-weight="700">Push → ECR</text>
    <text x="930" y="312" fill="#8fa3b0" font-size="10" text-anchor="middle">versioned registry</text>
  </g>

  <!-- Deploy -->
  <rect x="1066" y="250" width="158" height="96" rx="12" fill="#0c0e18" stroke="#34d399" stroke-opacity=".55"/>
  <text x="1145" y="290" fill="#34d399" font-size="13" text-anchor="middle" font-weight="700">Deploy CD</text>
  <text x="1145" y="310" fill="#8fa3b0" font-size="10" text-anchor="middle">ECS rolling update</text>

  <!-- Production -->
  <rect x="1256" y="250" width="136" height="96" rx="12" fill="#0c1a14" stroke="#34d399" stroke-opacity=".7"/>
  <text x="1324" y="290" fill="#34d399" font-size="13" text-anchor="middle" font-weight="700">Production</text>
  <text x="1324" y="310" fill="#8fa3b0" font-size="10" text-anchor="middle">zero downtime</text>

  <!-- arrows flow -->
  <g stroke-width="2" fill="none">
    <path d="M204 298 H248" stroke="#22d3ee" marker-end="url(#c)"/>
    <path d="M420 298 H486" stroke="#22d3ee" marker-end="url(#c)"/>
    <path d="M654 298 H668" stroke="#22d3ee" marker-end="url(#c)"/>
    <path d="M836 298 H850" stroke="#22d3ee" marker-end="url(#c)"/>
    <path d="M1006 298 H1062" stroke="#34d399" marker-end="url(#g)"/>
    <path d="M1224 298 H1252" stroke="#34d399" marker-end="url(#g)"/>
  </g>

  <!-- fail path -->
  <path d="M572 342 V430 H360 V352" stroke="#ff5c7a" stroke-width="1.6" fill="none" stroke-dasharray="5 5" marker-end="url(#r)"/>
  <rect x="470" y="410" width="230" height="40" rx="8" fill="#1a0e12" stroke="#ff5c7a" stroke-opacity=".4"/>
  <text x="585" y="435" fill="#ff8098" font-size="11" text-anchor="middle">✕ failure → blocks merge + notifies</text>

  <text x="48" y="500" fill="#5f7d8c" font-size="12">Automatic rollback if the health check fails · no version reaches production without passing tests.</text>
</svg>
