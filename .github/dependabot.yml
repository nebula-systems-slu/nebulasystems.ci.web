version: 2
updates:
  # Dependências do projeto (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bahia"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Prefixo conventional-commits: "chore" NÃO dispara release no semantic-release.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Agrupa updates para reduzir o número de PRs (menos ruído).
    groups:
      production-deps:
        applies-to: version-updates
        dependency-type: "production"
      dev-deps:
        applies-to: version-updates
        dependency-type: "development"

  # Atualização das próprias GitHub Actions (versões dos `uses:`)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci)"
