version: 2
updates:
  # Dependências do projeto (npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bahia"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Prefixo conventional-commits: "chore" NÃO dispara release no semantic-release.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Agrupa updates para reduzir o número de PRs (menos ruído).
    groups:
      production-deps:
        applies-to: version-updates
        dependency-type: "production"
      dev-deps:
        applies-to: version-updates
        dependency-type: "development"
    ignore:
      # vitest 3+ exige vite 6; o projeto está no vite 5. Manter vitest na 2.x
      # (minor/patch continuam sendo atualizados) até migrarmos o vite.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]

  # Atualização das próprias GitHub Actions (versões dos `uses:`)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "chore(ci)"
