name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo branch/PR (economiza tempo e minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

  # Publica o build no S3 e limpa o cache do CloudFront.
  #
  # Roda em paralelo ao deploy da Vercel, que continua ativo: enquanto o
  # DNS apontar para lá, a Vercel serve produção e a AWS apenas recebe o
  # mesmo conteúdo. Isso permite comparar os dois antes do corte de DNS,
  # e mantém o rollback trivial — basta não virar o DNS.
  #
  # Depois do corte, a integração da Vercel pode ser desconectada pelo
  # painel dela (não há nada deste workflow para remover).
  deploy-aws:
    name: Publicar na AWS
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necessário para o OIDC emitir o token que assume a role.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          # Secret (não variable) porque o ARN carrega o ID da conta.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # Os arquivos em assets/ têm hash no nome: mudou o conteúdo, mudou
      # o nome. Por isso podem ser cacheados para sempre no navegador.
      # Sem --delete de propósito: durante o deploy o index.html antigo
      # ainda referencia os assets antigos, e apagá-los aqui deixaria o
      # site quebrado por alguns segundos.
      - name: Publicar assets com cache longo
        run: |
          aws s3 sync dist/assets/ "s3://${{ vars.AWS_SITE_BUCKET }}/assets/" \
            --cache-control "public, max-age=31536000, immutable"

      # Demais arquivos (favicon, robots.txt, vídeos) não têm hash no
      # nome, então cache de um dia: invalidação do CloudFront limpa a
      # borda, mas NÃO limpa o cache do navegador de quem já visitou.
      - name: Publicar demais arquivos
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_SITE_BUCKET }}/" \
            --delete --exclude "assets/*" --exclude "index.html" \
            --cache-control "public, max-age=86400"

      # Por último e sem cache: é o index.html que aponta para os assets
      # novos. Publicá-lo antes deles faria o site pedir arquivos que
      # ainda não existem.
      - name: Publicar index.html sem cache
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.AWS_SITE_BUCKET }}/index.html" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_ID }}" \
            --paths "/*"
